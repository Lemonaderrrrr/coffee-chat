<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Copy source</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 16px; }
  textarea { width: 100%; height: 70vh; font: 12px/1.4 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<!-- Local helper for deployment: shows a file from this repo as plain text so it can be copied
     into the Apps Script editor without the editor's auto-indent mangling it.
     Usage: /dev/copy.html?f=backend/Code.gs -->
<p id="info">Loading…</p>
<textarea id="src" spellcheck="false"></textarea>
<script>
  const f = new URLSearchParams(location.search).get('f') || 'backend/Code.gs';
  fetch('../' + f).then(r => r.text()).then(t => {
    const ta = document.getElementById('src');
    ta.value = t;
    document.getElementById('info').textContent = f + ' · ' + t.split('\n').length + ' lines · ' + t.length + ' chars';
    ta.focus(); ta.select();
  });
</script>
</body>
</html>
